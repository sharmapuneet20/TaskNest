<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>TaskNest</title>
</head>
<body>

    <!-- Signup -->
  <div id="signup-container">
    <h1>Signup</h1>
    <input type="text" class="username" placeholder="Username" required>
    <input type="password" class="password" placeholder="Password" required>
    <button class="button_signup" id="signup_btn" type="button">Signup</button>
    <div class="end_div">  
      <p class="account_text">Already have an account?</p>
      <a href="#" id="show-signin"><p class="text_signIn">Sign In</p></a> 
    </div>
  </div>

  <!-- Signin -->
  <div id="signin-container" style="display: none;">
    <h1>Signin</h1>
    <input type="text" class="username" placeholder="Username" required>
    <input type="password" class="password" placeholder="Password" required>
    <button class="button_signup" id="signin_btn" type="button">Signin</button>
    <div class="end_div">  
      <p class="account_text">Don’t have an account?</p>
      <a href="#" id="show-signup"><p class="text_signIn">Sign Up</p></a> 
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
